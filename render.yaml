# Render Blueprint for the NestJS backend (https://render.com/docs/blueprint-spec).
# Render builds and redeploys it on every push to master.
services:
  - type: web
    name: music-collection-backend
    runtime: node
    plan: free
    branch: master
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    # Must answer 200 without headers. /api/v1/users needs X-User-Id (401), so the
    # public OpenAPI document is used: it is only served once the app has started.
    healthCheckPath: /api/docs-json
    envVars:
      - key: NODE_VERSION
        value: "24"
      # The free plan has no persistent disk: the SQLite file is recreated
      # and re-seeded with the demo data on every deploy or restart.
      - key: DB_PATH
        value: music.sqlite
