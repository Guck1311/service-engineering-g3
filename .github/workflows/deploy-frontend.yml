name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [master]
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  # Allows a manual deploy from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check that the backend URL is configured
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Set the repository variable API_URL (Settings → Secrets and variables → Actions → Variables), e.g. https://music-collection-backend.onrender.com/api/v1"
            exit 1
          fi

      - run: npm ci
      - name: Build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # GitHub Pages serves 404.html for unknown paths. Using the app itself
      # as 404 page lets Vue Router handle deep links like /items/6.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
