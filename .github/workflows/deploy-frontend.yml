name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [master]
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  # Allows a manual deploy from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check that the backend URL is configured
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Set the repository variable API_URL (Settings → Secrets and variables → Actions → Variables), e.g. https://music-collection-backend.onrender.com/api/v1"
            exit 1
          fi

      - run: npm ci
      - run: npm run test:unit -- --run

      - name: Build
        env:
          # Baked into the bundle at build time (import.meta.env.VITE_API_URL).
          VITE_API_URL: ${{ vars.API_URL }}
          # Project sites are served under /<repository>/.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # GitHub Pages has no SPA fallback: reloading /<repo>/catalogue/6 would be a 404.
      # Pages serves 404.html for unknown paths, so a copy of the app as 404.html
      # starts the SPA there, and Vue Router shows the right page for the URL.
      - run: cp dist/index.html dist/404.html

      # The component catalogue, published next to the app under /<repository>/storybook/.
      # It runs on its own fake backend, so it works even when the real one sleeps.
      - run: npm run build-storybook -- -o dist/storybook

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
