name: Frontend CI

# Runs only when something in frontend/ changes.
on:
  push:
    branches: [master]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # ci:* scripts only check; `npm run lint` / `format` would fix files and hide problems.
      - run: npm run ci:lint
      - run: npm run ci:format
      - run: npm run test:unit -- --run
      - run: npm run build # includes the vue-tsc type check
